<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的作品 · 点豆科技</title>
  <meta name="description" content="点豆科技账号下的作品与积分明细：头像与拼豆图纸云端保存，换设备登录即可查看。" />
  <link rel="icon" href="/apps/pixelart/assets/brand/logo-v3-round.svg" />
  <link rel="stylesheet" href="/shared/base.css?v=20261031f" />
  <link rel="stylesheet" href="/shared/my.css?v=20261031b" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a class="brand-item" href="/" title="点豆 · 拼豆图纸">
          <span class="brand-badge" aria-hidden="true">
            <svg viewBox="0 0 96 96" fill="none">
              <g transform="translate(-2.4 2.1) scale(0.9)">
                <path d="M32 26 H44 C 60 26 70 35 70 48 C 70 61 60 70 44 70 H32" stroke="#1F1D1A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="80" cy="76" r="7" fill="#1F1D1A"/>
              </g>
            </svg>
          </span>
          <span class="brand-name">点豆</span>
        </a>
        <a class="brand-item" href="/apps/avatar/" title="成像 · AI 头像">
          <span class="brand-badge" aria-hidden="true">
            <svg viewBox="0 0 96 96" fill="none">
              <path d="M48.6 19.2 A 14 14 0 1 0 58.6 24.9" stroke="#1F1D1A" stroke-width="10" stroke-linecap="round" fill="none"/>
              <circle cx="55" cy="18" r="5" fill="#1F1D1A"/>
              <path d="M25 80 C25 61 34 52 47 52 C60 52 69 61 69 80" stroke="#1F1D1A" stroke-width="10" stroke-linecap="round" fill="none"/>
            </svg>
          </span>
          <span class="brand-name">成像</span>
        </a>
      </div>
      <div class="topbar-actions">
        <button class="btn secondary" id="btnLogin" type="button" hidden>登录</button>
        <button class="btn small pill" id="btnWallet" type="button" hidden title="点击查看积分与充值">
          <svg class="icon icon-16" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
          </svg>
          <span>积分 <b id="walletBalance">–</b></span>
        </button>
        <button class="btn ghost small" id="btnSignOut" type="button" hidden>退出</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>我的作品</h1>
      <p class="hint">生成记录保存在云端，换设备登录即可看到；按产品保留最近 30 个 / 90 天。</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab cur" id="tabWorks" type="button" role="tab" aria-selected="true">作品</button>
      <button class="tab" id="tabTxns" type="button" role="tab" aria-selected="false">积分明细</button>
    </div>

    <section id="panelWorks">
      <div class="filters" id="workFilters">
        <button class="chip cur" type="button" data-filter="all">全部</button>
        <button class="chip" type="button" data-filter="pixelart">点豆 · 图纸</button>
        <button class="chip" type="button" data-filter="avatar">成像 · 头像</button>
      </div>
      <div class="works-grid" id="worksGrid"></div>
      <div class="empty" id="worksEmpty" hidden></div>
      <p class="works-note" id="worksNote" hidden></p>
    </section>

    <section id="panelTxns" hidden>
      <div class="txn-list" id="txnList"><p class="hint">加载中…</p></div>
    </section>
  </main>

  <div class="modal-mask" id="loginModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="modal-head">
        <h3 id="loginTitle">登录</h3>
        <button class="btn ghost" id="btnCloseLogin" type="button" aria-label="关闭登录">×</button>
      </div>
      <p class="modal-desc">登录后作品与积分全平台同步，换设备也不丢。</p>

      <span class="group-label">手机验证码登录 / 注册</span>
      <label class="field-label" for="loginPhone">手机号</label>
      <div class="phone-row">
        <input type="tel" id="loginPhone" class="text-input mono" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel" />
        <button class="btn secondary small" id="btnSendCode" type="button">获取验证码</button>
      </div>
      <p class="field-error" id="errPhone" hidden>请输入正确的 11 位手机号</p>

      <label class="field-label" for="loginCode">验证码</label>
      <input type="text" id="loginCode" class="text-input mono" inputmode="numeric" maxlength="6" placeholder="短信验证码" autocomplete="one-time-code" />
      <p class="field-error" id="errCode" hidden>请输入正确的验证码</p>

      <button class="btn primary big" id="btnPhoneLogin" type="button">登录 / 注册</button>

      <div class="login-divider"><span>或</span></div>
      <button class="btn ghost big" id="btnWechatLogin" type="button">微信扫码 / 一键登录</button>
      <p class="hint" id="loginMsg"></p>
    </div>
  </div>

  <div class="lightbox-mask" id="lightbox" hidden>
    <div class="lightbox-body" role="dialog" aria-modal="true" aria-label="图片预览">
      <img id="lightboxImg" alt="作品预览" />
      <button class="btn-close-lightbox" id="btnCloseLightbox" type="button" aria-label="关闭预览">×</button>
    </div>
  </div>

  <script defer src="/shared/workbuddy-cloud.global.js?v=20261027"></script>
  <script defer src="/shared/platform.js?v=20261031g"></script>
  <script defer src="/shared/my.js?v=20261031f"></script>
</body>
</html>
